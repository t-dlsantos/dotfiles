# set true color (terminal)
set -as terminal-overrides ',*:Tc'
set -g default-terminal "tmux-256color"

# navigate windows
bind -n M-H previous-window
bind -n M-L next-window

# resize panes using vim keys
unbind C-UP
unbind C-DOWN
unbind C-LEFT
unbind C-RIGHT

bind -n M-h resize-pane -L 5
bind -n M-l resize-pane -R 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5

# mouse usage
set -g mouse on

# send prefix -> ctrl + a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# open new pane in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vi mode
set -g mode-keys vi

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

## powerkit
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "datetime,battery,cpu,memory,git,hostname"
set -g @powerkit_theme "catppuccin"
set -g @powerkit_theme_variant "mocha"

# initilize tpm
run '~/.tmux/plugins/tpm/tpm'
